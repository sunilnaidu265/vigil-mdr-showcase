<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 975" width="1180" height="975" font-family="Arial, sans-serif">
  <title>How Vigil MDR works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker>
    <marker id="plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker>
    <style>
      .t{font-size:16px;font-weight:bold;fill:#fff;text-anchor:middle}
      .s{font-size:12.5px;fill:#fff;text-anchor:middle}
      .zone{font-size:15px;font-weight:bold;fill:#334e68}
      .note{font-size:12.5px;fill:#52606d}
      .line{stroke:#52606d;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .both{stroke:#52606d;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .planned{stroke:#c0392b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#plan)}
      .ptext{font-size:12.5px;font-style:italic;fill:#c0392b}
    </style>
  </defs>
  <rect width="1180" height="975" fill="#ffffff"/>
  <text x="590" y="36" font-size="24" font-weight="bold" fill="#102a43" text-anchor="middle">How Vigil MDR Works</text>
  <text x="590" y="60" class="note" text-anchor="middle">Solid arrows run today. The dashed red arrow is planned.</text>

  <!-- Cloud -->
  <rect x="30" y="80" width="1120" height="155" rx="10" fill="#f0f4f8" stroke="#bcccdc"/>
  <text x="50" y="106" class="zone">Test endpoint and LimaCharlie cloud</text>
  <rect x="70" y="122" width="250" height="92" rx="8" fill="#334e68"/>
  <text x="195" y="155" class="t">1. Endpoint telemetry</text><text x="195" y="178" class="s">Windows test machine</text><text x="195" y="197" class="s">LimaCharlie EDR sensor</text>
  <rect x="465" y="122" width="250" height="92" rx="8" fill="#2f855a"/>
  <text x="590" y="155" class="t">2. Detection</text><text x="590" y="178" class="s">Sigma and managed rules</text><text x="590" y="197" class="s">Alerts mapped to MITRE ATT&amp;CK</text>
  <rect x="860" y="122" width="250" height="92" rx="8" fill="#1f7a8c"/>
  <text x="985" y="155" class="t">Detection history</text><text x="985" y="178" class="s">LimaCharlie Insight</text><text x="985" y="197" class="s">Holds alerts until collected</text>
  <path class="line" d="M320 168H463"/><path class="line" d="M715 168H858"/>

  <!-- Laptop -->
  <rect x="30" y="262" width="1120" height="468" rx="10" fill="#fffdf5" stroke="#d9c58b"/>
  <text x="50" y="288" class="zone">Analyst laptop: runs in the background</text>

  <rect x="70" y="315" width="250" height="92" rx="8" fill="#52606d"/>
  <text x="195" y="348" class="t">Scheduled job</text><text x="195" y="371" class="s">Starts every 5 minutes</text><text x="195" y="390" class="s">Retries after failures</text>
  <rect x="465" y="315" width="250" height="92" rx="8" fill="#1f7a8c"/>
  <text x="590" y="343" class="t">3. Collection</text><text x="590" y="365" class="s">Read-only API key, short-lived JWT</text><text x="590" y="383" class="s">Cursor paging, lookback overlap</text><text x="590" y="399" class="s">Deduplicates by detection ID</text>
  <rect x="860" y="315" width="250" height="92" rx="8" fill="#486581"/>
  <text x="985" y="348" class="t">4. Sanitization</text><text x="985" y="371" class="s">Redacts secrets in command lines</text><text x="985" y="390" class="s">Saves masked raw detections</text>
  <path class="line" d="M320 361H463"/><path class="line" d="M715 361H858"/>
  <path class="line" d="M985 214V246H660V313"/>
  <text x="672" y="294" class="note">Outbound API pull over TLS</text>

  <rect x="860" y="442" width="250" height="92" rx="8" fill="#486581"/>
  <text x="985" y="475" class="t">5. Normalization</text><text x="985" y="498" class="s">Common incident model</text><text x="985" y="517" class="s">Host, user, process, time, ATT&amp;CK</text>
  <rect x="465" y="442" width="250" height="92" rx="8" fill="#b7791f"/>
  <text x="590" y="470" class="t">6. Correlation and scoring</text><text x="590" y="492" class="s">Groups by process atoms and time</text><text x="590" y="510" class="s">Deterministic risk score</text><text x="590" y="526" class="s">Allowlisted tools score lower</text>
  <rect x="70" y="442" width="250" height="92" rx="8" fill="#b7791f"/>
  <text x="195" y="475" class="t">Aggregation window</text><text x="195" y="498" class="s">Holds for late-arriving alerts</text><text x="195" y="517" class="s">New alerts trigger re-analysis</text>
  <path class="line" d="M985 407V440"/><path class="line" d="M858 488H717"/><path class="line" d="M463 488H322"/>

  <rect x="70" y="570" width="250" height="110" rx="8" fill="#c0392b"/>
  <text x="195" y="600" class="t">7. Prompt construction</text><text x="195" y="622" class="s">Core rules + up to 4 playbooks</text><text x="195" y="640" class="s">Trusted context kept apart from</text><text x="195" y="658" class="s">untrusted evidence</text>
  <rect x="465" y="570" width="250" height="110" rx="8" fill="#7b241c"/>
  <text x="590" y="600" class="t">8. Local AI triage</text><text x="590" y="622" class="s">Ollama on the laptop</text><text x="590" y="640" class="s">Temperature 0</text><text x="590" y="658" class="s">Schema-constrained JSON</text>
  <rect x="860" y="570" width="250" height="110" rx="8" fill="#6c3483"/>
  <text x="985" y="596" class="t">9. Validation</text><text x="985" y="617" class="s">Checks schema and event IDs</text><text x="985" y="635" class="s">Flags failures for manual triage</text><text x="985" y="653" class="s">Defangs IOCs in code</text>
  <path class="line" d="M195 534V568"/><path class="line" d="M320 625H463"/>
  <path class="line" d="M715 605H858"/><path class="line" d="M858 650H717"/>
  <text x="787" y="595" class="note" text-anchor="middle">verdict</text><text x="787" y="668" class="note" text-anchor="middle">retry once</text>

  <!-- Review -->
  <rect x="30" y="750" width="1120" height="205" rx="10" fill="#f8f4fb" stroke="#d6c3e6"/>
  <text x="50" y="776" class="zone">Case management and human review</text>
  <rect x="860" y="798" width="250" height="125" rx="8" fill="#334e68"/>
  <text x="985" y="832" class="t">10. Case store</text><text x="985" y="856" class="s">PostgreSQL</text><text x="985" y="875" class="s">Incidents, detections, events,</text><text x="985" y="894" class="s">analyses and reviews</text>
  <rect x="465" y="798" width="250" height="125" rx="8" fill="#6c3483"/>
  <text x="590" y="826" class="t">11. Web portal</text><text x="590" y="848" class="s">Login-protected</text><text x="590" y="867" class="s">Queue, process trees, dashboard</text><text x="590" y="886" class="s">Evidence links and reports</text>
  <rect x="70" y="798" width="250" height="125" rx="8" fill="#52606d"/>
  <text x="195" y="832" class="t">12. Analyst</text><text x="195" y="856" class="s">Validates claims against evidence</text><text x="195" y="875" class="s">Approves, edits or rejects</text><text x="195" y="894" class="s">Decisions go to an audit trail</text>
  <path class="line" d="M985 680V796"/>
  <path class="both" d="M860 860H717"/><path class="both" d="M465 860H322"/>

  <path class="planned" d="M68 860H12V252H590V216"/>
  <text x="24" y="500" class="ptext" transform="rotate(-90 24 500)" text-anchor="middle">Planned: reviews tune detection rules</text>
</svg>
